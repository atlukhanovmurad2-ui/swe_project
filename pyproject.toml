[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foodanalyzer"
version = "1.0.0"
description = "Software-engineering layer around the AI Food Analyzer module"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.7",
    "requests>=2.31",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "httpx>=0.27"]

[project.scripts]
foodanalyzer = "foodanalyzer.cli:main"
foodanalyzer-api = "foodanalyzer.api:run"

[tool.setuptools.packages.find]
include = ["foodanalyzer*", "ai*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["foodanalyzer"]
